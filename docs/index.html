<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json-to-dom-datalist | Standalone Demo</title>
    <!-- Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
        }

        .top-nav {
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
        }

        .panel-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .dom-inspector {
            background: #0f172a;
            color: #38bdf8;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            height: 380px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <header class="top-nav">
        <div class="d-flex align-items-center gap-2">
            <span class="fw-bold text-dark small">json-to-dom-datalist</span>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-0.5 font-monospace" style="font-size: 11px;">Standalone</span>
        </div>
        <a href="../../json-to-dom-renderers/docs/index.html" class="btn btn-sm btn-outline-secondary py-1 px-2.5 d-flex align-items-center gap-1" style="font-size: 12px;">
            <i class="bi bi-arrow-left"></i> Home
        </a>
    </header>

    <main class="container-fluid px-3 py-2">
        <div class="row g-2">
            <div class="col-lg-6">
                <div class="panel-box">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-1 border-bottom">
                        <span class="fw-bold small text-dark"><i class="bi bi-search me-1 text-primary"></i>Live Autocomplete Test</span>
                        <span class="badge bg-info-subtle text-info border small">HTML5 &lt;datalist&gt;</span>
                    </div>

                    <div class="mb-3">
                        <label for="stock-input" class="form-label small fw-semibold text-dark">
                            Stock Item Name (double-click or type):
                        </label>
                        <input class="form-control" id="stock-input" list="allinventoryentries.stockitemname-datalist" placeholder="e.g. ROPE or Shading...">
                        <div class="form-text small text-muted">
                            Bound to <code>&lt;datalist id="allinventoryentries.stockitemname-datalist"&gt;</code>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="batch-input" class="form-label small fw-semibold text-dark">
                            Batch Name (double-click or type):
                        </label>
                        <input class="form-control" id="batch-input" list="allinventoryentries.batchallocations.batchname-datalist" placeholder="e.g. 10 MM or 20 MM...">
                        <div class="form-text small text-muted">
                            Bound to <code>&lt;datalist id="allinventoryentries.batchallocations.batchname-datalist"&gt;</code>
                        </div>
                    </div>

                    <div id="datalist-target-container"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="dom-inspector">
                    <div class="text-secondary pb-1 mb-2 border-bottom border-secondary">// Rendered DOM Tree & Options Summary</div>
                    <pre class="m-0 text-info" id="inspector-output">Inspecting generated datalists...</pre>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { sampleColumns, sampleDatalistConfig, sampleData } from "./sampleData.js";
        import { DataList } from "./dist/v1/min.js";

        // Guaranteed self-contained json-to-dom engine
        if (!window.ks?.["json-to-dom"]?.buildSpecElement) {
            const isNullOrUndefined = ({ inSpec }) => !inSpec;
            const isDOMNode = ({ inSpec }) => inSpec instanceof Node;
            const isArray = ({ inSpec }) => Array.isArray(inSpec);
            const isObject = ({ inSpec }) => typeof inSpec === "object" && !!inSpec;
            const handleArray = ({ inSpec }) => inSpec.map(item => buildSpecElement(item)).flat().filter(Boolean);
            const createElement = ({ inTagName }) => document.createElement(inTagName);
            const applyTextContent = ({ inElement, inTextContent }) => {
                if (inTextContent) inElement.textContent = inTextContent;
                return inElement;
            };
            const applyProperties = ({ inElement, inProperties }) => {
                if (inProperties) Object.assign(inElement, inProperties);
                return inElement;
            };
            const applyAttributes = ({ inElement, inAttributes }) => {
                if (inAttributes) {
                    Object.entries(inAttributes).forEach(([key, val]) => {
                        if (key === "class") inElement.className = val;
                        else inElement.setAttribute(key, val);
                    });
                }
                return inElement;
            };
            const applyClassList = ({ inElement, inClassList }) => {
                if (inClassList) {
                    if (Array.isArray(inClassList)) inClassList.forEach(c => c && inElement.classList.add(c));
                    else if (typeof inClassList === "string") inClassList.split(" ").forEach(c => c && inElement.classList.add(c));
                }
                return inElement;
            };
            const applyEvents = ({ inElement, inEvents, inTagName }) => {
                if (inEvents && typeof inEvents === "object") {
                    Object.entries(inEvents).forEach(([ev, handler]) => {
                        if (typeof handler === "function") inElement.addEventListener(ev, handler);
                    });
                }
                return inElement;
            };
            const appendChildren = ({ inElement, inChildren }) => {
                if (inChildren && Array.isArray(inChildren)) {
                    inChildren.forEach(ch => {
                        const node = buildSpecElement(ch);
                        if (node) inElement.appendChild(node);
                    });
                }
                return inElement;
            };
            const handleElement = ({ inSpec }) => {
                const el = createElement({ inTagName: inSpec.tagName || "div" });
                applyAttributes({ inElement: el, inAttributes: inSpec.attributes });
                applyClassList({ inElement: el, inClassList: inSpec.classList });
                applyProperties({ inElement: el, inProperties: inSpec.properties });
                applyTextContent({ inElement: el, inTextContent: inSpec.textContent });
                applyEvents({ inElement: el, inEvents: inSpec.events, inTagName: inSpec.tagName });
                appendChildren({ inElement: el, inChildren: inSpec.children });
                return el;
            };
            const buildSpecElement = (specInput) => {
                const spec = specInput && typeof specInput === "object" && "inSpec" in specInput && !(specInput instanceof Node) && !Array.isArray(specInput) ? specInput.inSpec : specInput;
                if (isNullOrUndefined({ inSpec: spec })) return null;
                if (isDOMNode({ inSpec: spec })) return spec;
                if (isArray({ inSpec: spec })) return handleArray({ inSpec: spec });
                if (isObject({ inSpec: spec })) return handleElement({ inSpec: spec });
                return null;
            };
            window.ks = window.ks || {};
            window.ks["json-to-dom"] = { buildSpecElement };
        }

        const dataList = new DataList({
            targetContainerId: "datalist-target-container",
            data: sampleData,
            columns: sampleColumns,
            config: sampleDatalistConfig
        });

        dataList.render();

        const updateInspector = ({ inContainerId } = {}) => {
            const localContainerId = inContainerId;
            const container = document.getElementById(localContainerId);
            const inspector = document.getElementById("inspector-output");
            if (!container || !inspector) return;

            const lists = container.querySelectorAll("datalist");
            let summary = `Found ${lists.length} <datalist> elements generated:\n\n`;

            lists.forEach(dl => {
                const opts = dl.querySelectorAll("option");
                summary += `• <datalist id="${dl.id}"> [${opts.length} unique values]\n`;
                opts.forEach((opt, idx) => {
                    if (idx < 6) summary += `    - "${opt.value}"\n`;
                });
                if (opts.length > 6) summary += `    ... and ${opts.length - 6} more options\n`;
                summary += "\n";
            });

            inspector.textContent = summary;
        };

        updateInspector({ inContainerId: "datalist-target-container" });
    </script>
</body>

</html>
